name: Android APK

# Release cycle (same shape as Sasta): push to main -> tests, lint, signed APK, emulator smoke test.
# Tag vX.Y.Z -> publish the EXACT APK that passed on main for that commit, with SHA256SUMS.
# Releases need the owner's approval: nothing here tags or publishes by itself.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # Don't let the action install the removed "tools" package; install exactly what we need.
          packages: ''
      - run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check version and release notes
        run: scripts/check-version.sh

      # Optional private signing key (repository secrets). Without it the APK is signed with the debug key:
      # it installs, but updates will not install over builds from a different machine.
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.CREDU1AR_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CREDU1AR_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests, lint, release + debug APKs
        env:
          CREDU1AR_KEY_ALIAS: ${{ secrets.CREDU1AR_KEY_ALIAS }}
          CREDU1AR_STORE_PASSWORD: ${{ secrets.CREDU1AR_STORE_PASSWORD }}
          CREDU1AR_KEY_PASSWORD: ${{ secrets.CREDU1AR_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export VERSION_CODE=$((10000 + BUILD_NUMBER))
          ./gradlew --no-daemon :core:test :app:lintDebug :app:assembleRelease :app:assembleDebug

      - name: Collect and verify APK
        run: |
          mkdir -p out
          VERSION="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          cp app/build/outputs/apk/release/app-release.apk "out/Credu1ar-v${VERSION}-android.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs out/*.apk
          (cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          du -h out/*.apk | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: credu1ar-apk
          path: out/*
          if-no-files-found: error
          retention-days: 14

      - name: Ensure sqlite3 for the smoke test
        run: command -v sqlite3 || sudo apt-get install -y sqlite3

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The debug APK carries a debug-only SMS injector, so a real multi-part SMS PDU goes through the production
      # SmsReceiver (the emulator console's `sms send` is unreliable). See scripts/android-smoke.sh.
      - name: Smoke test on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: scripts/android-smoke.sh app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version and has release notes
        run: scripts/check-version.sh "${GITHUB_REF_NAME}"
      - name: Publish the exact APK tested on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          RUN_ID="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f branch=main -f status=success -f per_page=20 \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_sha == env.GITHUB_SHA)] | first | .id // empty')"
          if [ -z "$RUN_ID" ]; then
            echo '::error::This exact commit must pass the main Android build and emulator smoke test before release.'
            exit 1
          fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name credu1ar-apk --dir out
          (cd out && sha256sum --check SHA256SUMS.txt)
          test -f "out/Credu1ar-v${VERSION}-android.apk"
          gh release create "$GITHUB_REF_NAME" out/Credu1ar-*.apk out/SHA256SUMS.txt \
            --title "Credu1ar ${GITHUB_REF_NAME}" --notes-file "docs/releases/${GITHUB_REF_NAME}.md" --verify-tag
